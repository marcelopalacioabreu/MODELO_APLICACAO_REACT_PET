services:
  # Maestro de Conectividade (Sincronização entre serviços da Aplicação Modelo)
  redis:
    image: redis:alpine
    container_name: aplicacao-modelo-redis
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    ports:
      - "6380:6379" # Porta diferente para evitar conflito com CRM-EMTEC se rodando

  mongodb:
    image: mongo:4.4
    container_name: aplicacao-modelo-mongodb
    profiles:
      - dev
    ports:
      - "27019:27017" # Porta diferente para evitar conflito
    volumes:
      - ./mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    deploy:
      replicas: 1
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    environment:
      - TZ=America/Sao_Paulo
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LANG=pt_BR.UTF-8
      - LC_ALL=pt_BR.UTF-8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: aplicacao-modelo-frontend
    ports:
      - "3002:3000"
    environment:
      - TZ=America/Sao_Paulo
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
      - INTERNAL_BACKEND_URL=http://backend:5000/api
      - BACKEND_URL=http://backend:5000/api
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: aplicacao-modelo-nginx
    ports:
      - "81:80"
      - "444:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl/certs:/etc/ssl/certs:ro
      - ./nginx/ssl/private:/etc/ssl/private:ro
    restart: unless-stopped
    depends_on:
      - frontend
